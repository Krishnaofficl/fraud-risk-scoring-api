<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FraudScope</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-page-container">

        <!-- Header with Green, Blue, Red logo -->
        <header class="top-header" style="justify-content: center; margin-bottom: 20px;">
            <a href="/" class="logo-area" style="text-decoration: none;">
                <div class="cf-logo-bars">
                    <div class="cf-bar cf-bar-green"></div>
                    <div class="cf-bar cf-bar-blue"></div>
                    <div class="cf-bar cf-bar-red"></div>
                </div>
                <div>
                    <span class="site-title">FraudScope</span>
                    <span class="site-subtitle">| Risk Scoring Portal</span>
                </div>
            </a>
        </header>

        <!-- Login Roundbox -->
        <div class="roundbox">
            <div class="roundbox-caption">
                <span>Sign In to FraudScope</span>
                <a href="/" style="font-size: 11px; font-weight: normal;">&larr; Back to Home</a>
            </div>
            <div class="roundbox-body" style="padding: 20px;">
                <div id="loginAlert" class="alert-message alert-error"></div>
                
                <form id="standaloneLoginForm" onsubmit="handleStandaloneLogin(event)">
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label>Email Address:</label>
                        <input type="email" id="loginEmail" class="cf-input" required placeholder="analyst@example.com" autofocus>
                    </div>
                    <div class="form-group" style="margin-bottom: 16px;">
                        <label>Password:</label>
                        <input type="password" id="loginPassword" class="cf-input" required placeholder="••••••••">
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <button type="submit" id="btnLogin" class="cf-button">
                            <span>Sign In</span>
                        </button>
                        <span style="font-size: 11px;">
                            No account? <a href="/register">Register here</a>
                        </span>
                    </div>
                </form>
            </div>
        </div>

        <footer class="site-footer" style="margin-top: 15px; border-top: none;">
            <p>FraudScope &bull; Vehicle Loan Risk Benchmark</p>
        </footer>

    </div>

    <script>
        // Redirect to homepage if already authenticated
        const existingToken = localStorage.getItem("cf_jwt_token");
        if (existingToken) {
            fetch("/v1/users/me", { headers: { "Authorization": `Bearer ${existingToken}` } })
                .then(res => { if (res.ok) window.location.href = "/"; });
        }

        async function handleStandaloneLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById("loginAlert");
            const btn = document.getElementById("btnLogin");
            alertBox.style.display = "none";
            btn.disabled = true;

            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("cf_jwt_token", data.access_token);
                    window.location.href = "/";
                } else {
                    alertBox.textContent = data.message || data.detail || "Invalid email or password.";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.textContent = "Network error connecting to API.";
                alertBox.style.display = "block";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
