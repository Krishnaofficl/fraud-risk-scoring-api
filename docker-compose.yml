services:
  postgres:
    image: postgres:16-alpine
    container_name: fraud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraud_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PROJECT_NAME=Fraud & Risk Scoring API
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fraud_db}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-32-byte-secret-key}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - MODEL_PATH=artifacts/model_pipeline.joblib
      - MODEL_VERSION=v1-baseline
      - LOG_LEVEL=INFO
      - LOG_JSON_FORMAT=true
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - postgres
    networks:
      - fraud_network

volumes:
  postgres_data:
    driver: local

networks:
  fraud_network:
    driver: bridge
